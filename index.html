<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Priorify AI — ruang futuristis untuk mengatur prioritas tugas akademik, jadwal belajar, dan menemukan fokusmu." />
    <meta name="theme-color" content="#ecf5fd" />
    <title>Priorify AI — Find Your Flow</title>
    <script>
      try {
        var savedTheme = JSON.parse(localStorage.getItem('priorify_theme'));
        var initialTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = initialTheme;
        document.documentElement.dataset.motion = JSON.parse(localStorage.getItem('priorify_motion')) === false ? 'reduced' : 'full';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
